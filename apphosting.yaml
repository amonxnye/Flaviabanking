# Firebase App Hosting configuration (backend: flaviafintech, project: silkevents-ug).
#
# Public Firebase web config is set as plain values. Every secret must first be
# created in Secret Manager, e.g.
#   firebase apphosting:secrets:set IOTEC_CLIENT_SECRET
# and then uncommented below. A referenced secret that does not exist fails the rollout.
# The server uses Application Default Credentials (the backend's service account),
# so FIREBASE_SERVICE_ACCOUNT is NOT needed here.

runConfig:
  minInstances: 0

env:
  # --- Firebase (public identifiers) ---
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAAggFnXvRtHRjZ8GwWVl9LqkSrIcA9jyg
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: silkevents-ug.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: silkevents-ug
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: silkevents-ug.appspot.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "451791274337"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:451791274337:web:f0c3668de6bc0aa2530520
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://flaviafintech--silkevents-ug.us-east4.hosted.app
    availability: [BUILD, RUNTIME]

  # --- Secrets: create each with `firebase apphosting:secrets:set <NAME>` then uncomment ---
  # - variable: IOTEC_CLIENT_ID
  #   secret: IOTEC_CLIENT_ID
  # - variable: IOTEC_CLIENT_SECRET
  #   secret: IOTEC_CLIENT_SECRET
  # - variable: IOTEC_WALLET_ID
  #   secret: IOTEC_WALLET_ID
  # - variable: IOTEC_WEBHOOK_SECRET
  #   secret: IOTEC_WEBHOOK_SECRET

  # --- AI assistant (AgentStudio). All four are needed, plus one signing secret per tool. ---
  - variable: STUDIO_URL
    value: https://agentstudio--ridelinkx.us-east4.hosted.app
  # - variable: STUDIO_AGENT_ID            # id of the agent created in AgentStudio
  #   value: <agent id>
  # - variable: STUDIO_API_KEY
  #   secret: STUDIO_API_KEY
  # - variable: STUDIO_SECRET_GET_WALLET_BALANCE
  #   secret: STUDIO_SECRET_GET_WALLET_BALANCE
  # - variable: STUDIO_SECRET_LIST_RECENT_COLLECTIONS
  #   secret: STUDIO_SECRET_LIST_RECENT_COLLECTIONS
  # - variable: STUDIO_SECRET_GET_LINKED_ACCOUNTS
  #   secret: STUDIO_SECRET_GET_LINKED_ACCOUNTS
  # - variable: NEXT_PUBLIC_SENTRY_DSN      # optional: your own Sentry project's DSN
  #   secret: NEXT_PUBLIC_SENTRY_DSN
  #   availability: [BUILD, RUNTIME]
